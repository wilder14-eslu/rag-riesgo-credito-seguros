[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "riskrag"
version = "0.1.0"
description = "RAG experto en riesgo crediticio y seguros con NLP, seguridad por diseño, servidores MCP y despliegue en AWS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wilder Espinoza Luna" }]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "snowballstemmer>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34", "PyJWT[crypto]>=2.8"]
pg = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2", "pgvector>=0.2.5"]
opensearch = ["opensearch-py>=2.4"]
mcp = ["mcp[cli]>=1.2"]
pdf = ["pypdf>=4.0"]
nlp = ["spacy>=3.7", "presidio-analyzer>=2.2", "transformers>=4.40", "torch>=2.2"]
eval = ["ragas>=0.2"]
dev = ["PyJWT[crypto]>=2.8", "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "pip-audit>=2.7", "mypy>=1.9", "types-PyYAML"]
all = ["riskrag[aws,pg,opensearch,mcp,pdf]"]

[project.scripts]
riskrag = "riskrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riskrag = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]  # permite importar el paquete eval/ al correr "pytest" sin "python -m"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "E501", "SIM905"]  # E501: el formateador controla el largo; quedan regex y textos largos

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"eval/*" = ["S"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true
