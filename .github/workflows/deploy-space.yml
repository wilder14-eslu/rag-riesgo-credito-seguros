name: Demo en Hugging Face

# Publica la demo en un Space de Hugging Face cuando CI pasa en main.
# Requiere en GitHub: el secreto HF_TOKEN (token con permiso de escritura) y la variable
# HF_SPACE con el nombre del Space, por ejemplo "usuario/riskrag".
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  publicar:
    if: >-
      vars.HF_SPACE != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Armar el contenido del Space
        run: |
          mkdir -p /tmp/space/data
          cp -r src configs pyproject.toml LICENSE /tmp/space/
          cp -r data/sample /tmp/space/data/
          cp space/Dockerfile /tmp/space/Dockerfile
          cp space/README.md /tmp/space/README.md
          find /tmp/space -name "__pycache__" -prune -exec rm -rf {} +

      - name: Publicar en Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
          AUTOR: ${{ github.actor }}
        run: |
          cd /tmp/space
          git init -q -b main
          git config user.name "$AUTOR"
          git config user.email "$AUTOR@users.noreply.github.com"
          git add -A
          git commit -q -m "Demo desde ${GITHUB_SHA::7}"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
