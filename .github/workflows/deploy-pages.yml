name: Desplegar Demo en GitHub Pages

# Construye el paquete de la demo con el índice pre-cargado y lo publica
# en GitHub Pages (0 costo, 0 cold-start, ejecutado en el navegador del usuario).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  desplegar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias para ingesta
        run: |
          pip install -e "."

      - name: Asegurar que el corpus esté indexado
        run: |
          python -m riskrag.cli ingest data/sample

      - name: Generar bundle y sitio estático
        run: |
          python scripts/build_pages.py

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
