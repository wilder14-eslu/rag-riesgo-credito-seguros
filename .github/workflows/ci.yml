name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: riskrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-retries 10
    env:
      RISKRAG_TEST_PG_DSN: host=localhost port=5432 user=postgres password=postgres dbname=riskrag
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar
        run: pip install -e ".[dev,mcp,pg]"
      - name: Crear esquema pgvector
        run: |
          psql -h localhost -U postgres -d riskrag -v ON_ERROR_STOP=1 -f sql/001_crear_esquema_pgvector.sql
          psql -h localhost -U postgres -d riskrag -v ON_ERROR_STOP=1 -f sql/002_fnt_buscar_chunks_hibrido.sql
      - name: Lint y formato
        run: |
          ruff check src tests eval
          ruff format --check src tests eval
      - name: Pruebas
        run: pytest --cov=riskrag --cov-report=term-missing --cov-fail-under=80
      - name: Evaluación de regresión (puertas de calidad)
        run: |
          python -m riskrag.cli ingest data/sample
          python -m eval.run_eval
      - name: Guardar reporte de evaluación
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-evaluacion
          path: eval/reports/latest.json

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditoría de dependencias
        run: |
          pip install pip-audit
          pip install -e ".[aws,pg,mcp]"
          pip-audit --skip-editable
      - name: Análisis estático de seguridad (Bandit vía Ruff)
        run: |
          pip install ruff
          ruff check --select S src
      - name: Búsqueda de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contenedor:
    runs-on: ubuntu-latest
    needs: calidad
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t riskrag:ci .
      - name: Escanear imagen (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: riskrag:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  infraestructura:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - name: Revisión de seguridad de IaC (Checkov)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          soft_fail: true
